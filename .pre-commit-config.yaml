---
# Single source of tooling is uv; local hooks run tools through
# `uv run` so versions match the locked environment.
#   uv run pre-commit run --all-files
#   uv run pre-commit autoupdate --freeze
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: detect-private-key
      - id: debug-statements
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      # Only test_-prefixed files inside tests/ may define tests; the
      # anchor parser, config scanner, asymmetry table, conftest and
      # the mini-app stack are helpers.
      - id: name-tests-test
        args: ["--pytest-test-first"]
        exclude: |
          (?x)^tests/(
            .*__init__\.py$|
            .*conftest\.py$|
            static/(manifest_doc|alloy_config|asymmetries)\.py$|
            e2e/stack/
          )

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316  # frozen: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-no-log-warn
      - id: python-no-eval
      # The fuzz corpus is generated programmatically (escapes,
      # os.urandom) precisely so that source files stay clean for
      # this hook.
      - id: text-unicode-replacement-char
      - id: python-check-blanket-type-ignore

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: bebfac867564fbd992e5b45379b4b0568d5cb85b  # frozen: 3.6.1
    hooks:
      - id: editorconfig-checker
        alias: ec

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 4b2e70d08cb2ccd26d1fba73588de41c7a5d50b7  # frozen: v0.25
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 3db014c16a9d31997ab8c07a4d61fcce936c8f0d  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert

  - repo: https://github.com/Yelp/detect-secrets
    rev: 68e8b45440415753fff70a312ece8da92ba85b4a  # frozen: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # autoupdate --freeze writes 40-char SHAs the entropy detector
        # flags; uv.lock is hash soup by design.
        exclude: |
          (?x)(
            ^uv\.lock$|
            ^\.secrets\.baseline$|
            ^\.pre-commit-config\.yaml$
          )

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (project venv)
        entry: uv
        language: system
        types: [python]
        args: ["run", "ruff", "check", "--fix", "--show-fixes"]

      - id: ruff-format
        name: ruff format (project venv)
        entry: uv
        language: system
        types: [python]
        args: ["run", "ruff", "format"]

      - id: mypy
        name: mypy (project venv)
        entry: uv
        language: system
        types: [python]
        pass_filenames: false
        args: ["run", "mypy"]

      - id: uv-lock-check
        name: uv lock --check
        entry: uv
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
        args: ["lock", "--check"]

      - id: taplo
        name: taplo (TOML lint, system binary)
        entry: taplo
        language: system
        types: [toml]
        args: ["lint"]

      - id: hadolint
        name: hadolint (Dockerfile, system binary)
        entry: hadolint
        language: system
        files: (^|/)Dockerfile$

      - id: rumdl
        name: rumdl (markdown, system binary)
        entry: rumdl
        language: system
        types: [markdown]
        args: ["check"]

      - id: actionlint
        name: actionlint (workflows, system binary)
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: zizmor
        name: zizmor (workflow security, system binary)
        entry: zizmor
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
