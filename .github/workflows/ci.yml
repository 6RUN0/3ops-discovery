---
# Quality gates on every push/PR. Mirrors `uv run nox` (the default
# session set) split into independent jobs; the opt-in e2e suite lives
# in e2e.yml. Actions are SHA-pinned; tool versions are pinned in
# .github/scripts/install-gate-binaries.sh.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-tests:
    name: lint + static tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install gate binaries
        run: >-
          .github/scripts/install-gate-binaries.sh
          taplo hadolint rumdl actionlint zizmor
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: nox -s lint tests
        run: uv run nox -s lint tests

  docs-lint:
    name: docs lint (rumdl + typos + lychee)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install gate binaries
        run: .github/scripts/install-gate-binaries.sh rumdl typos lychee
      - name: nox -s docs_lint
        run: uv run nox -s docs_lint
        env:
          # lychee authenticates github.com link checks to avoid the
          # anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  alloy-check:
    name: alloy fmt + validate (all combos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: nox -s alloy_check
        run: uv run nox -s alloy_check
