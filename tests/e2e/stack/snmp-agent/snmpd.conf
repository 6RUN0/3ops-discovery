# Listen on all interfaces, UDP 161.
agentAddress udp:161

# SNMPv3 user for authPriv (SHA auth, AES priv).
#
# A deliberate, documented exception to the project rule "no secrets in
# git, not even fakes". Every other credential in this repository is
# generated per run into a gitignored directory; this pair cannot be,
# because the agent reads it from a file baked into the image at build
# time while the Alloy side reads it from a fixture -- the two must be
# equal before either process starts, so there is no run to generate it
# in. The values are throwaway, reach only an ephemeral local agent
# holding no data, and are torn down with the stack. They MUST stay
# equal to tools/stack_secrets.py, which carries the mirrored comment.
createUser netmon SHA "netmon-auth-pass" AES "netmon-priv-pass"
rouser netmon authPriv

# Minimal system identity so IF-MIB / system group answer.
sysLocation e2e
sysContact  platform
