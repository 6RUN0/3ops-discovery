---
# 3ops Discovery e2e stack. The compose project name is unique per
# run (xad-e2e-<run-id>, passed by the fixture with -p); assertions
# filter on the promoted compose_project label because a shared Docker
# daemon exposes foreign containers to discovery too.
#
# One telemetry network for every service: a container attached to
# several networks duplicates targets/exporters (manifest section 14).
# The docker-socket network is internal: only Alloy reaches the proxy.

networks:
  telemetry:
  docker-socket:
    internal: true

services:
  docker-socket-proxy:
    # GET-only filtered Docker API (manifest 13.3): allowlisted
    # sections only, POST disabled. loki.source.docker reads container
    # logs via GET /containers/<id>/logs, covered by CONTAINERS=1.
    image: tecnativa/docker-socket-proxy:v0.4.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      INFO: 1
      NETWORKS: 1
      POST: 0
    networks:
      - docker-socket

  alloy:
    image: grafana/alloy:v1.17.1
    command:
      - run
      - --stability.level=experimental
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy
    environment:
      # The contract env var is exercised for real: no socket mount in
      # this container at all.
      RU_3OPS_DISCOVERY_DOCKER_HOST: tcp://docker-socket-proxy:2375
      # Contract intervals (normal-v1 30s) must not change; only the
      # discovery refresh is accelerated for test budgets.
      RU_3OPS_DISCOVERY_DOCKER_REFRESH_INTERVAL: 5s
      # File-provider domain (037_snmp): the device file lives in a SECOND,
      # writable mount (the /etc/alloy mount is :ro and holds only *.alloy).
      # Only snmp_stack sets E2E_SNMP_DIR to a real dir; other runs get the
      # /dev/null default below and never load 037, so nothing reads this.
      RU_3OPS_DISCOVERY_SNMP_TARGETS_FILE: /etc/alloy-snmp/snmp_targets.yaml
    volumes:
      - ${RU_3OPS_DISCOVERY_E2E_CONFIG_DIR:?set by the pytest fixture}:/etc/alloy:ro
      - ${RU_3OPS_DISCOVERY_E2E_SECRETS_DIR:?set by the pytest fixture}:/run/alloy-secrets:ro
      - ${RU_3OPS_DISCOVERY_E2E_SNMP_DIR:-/dev/null}:/etc/alloy-snmp:ro
      # Host telemetry (070_host-metrics): procfs/sysfs/rootfs for
      # prometheus.exporter.unix. The rootfs mount would expose the host
      # docker.sock at /rootfs/var/run/docker.sock; a /dev/null overlay
      # masks it so the real socket never surfaces even read-only (this
      # container reaches Docker ONLY via docker-socket-proxy). On a shared
      # runner node_* reflect the runner host: acceptable, the stack is
      # ephemeral and torn down with `down -v`.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /dev/null:/rootfs/var/run/docker.sock:ro
    networks:
      - telemetry
      - docker-socket
    expose:
      - "12345"
      - "4317"
      - "4318"
    ports:
      - "127.0.0.1:0:12345"
    depends_on:
      docker-socket-proxy:
        condition: service_started
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    labels:
      # Dogfooding: the collector monitors itself through its own
      # discovery. The FULL mandatory metrics.* set, including
      # type=prometheus (020 hard-keeps on it).
      ru.3ops.discovery.enabled: "true"
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "platform"
      ru.3ops.discovery.metrics.enabled: "true"
      ru.3ops.discovery.metrics.type: "prometheus"
      ru.3ops.discovery.metrics.port: "12345"
      ru.3ops.discovery.metrics.job: "alloy"

  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - telemetry
    expose:
      - "9090"
    ports:
      - "127.0.0.1:0:9090"
    healthcheck:
      # promtool ships in the image; `check ready` polls /-/ready.
      test: ["CMD", "promtool", "check", "ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      ru.3ops.discovery.enabled: "true"
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "platform"
      ru.3ops.discovery.metrics.enabled: "true"
      ru.3ops.discovery.metrics.type: "prometheus"
      ru.3ops.discovery.metrics.port: "9090"
      ru.3ops.discovery.metrics.job: "prometheus"

  loki:
    # The grafana/loki image is distroless: no shell, wget or curl, so
    # a container healthcheck cannot probe /ready. Readiness is gated
    # instead by the pytest fixture, which polls /ready over HTTP after
    # `up`; alloy therefore depends on loki with condition
    # service_started and tolerates the backend not being ready yet
    # (loki.write retries).
    # Pinned to 3.6.x, not 3.7.x: grafana/loki:3.7.3 rejects every push
    # with "Ingester is shutting down" even from a bare `docker run`
    # (verified 3.6.12/3.5.5/3.4.6 all ingest, only 3.7.3 is broken).
    image: grafana/loki:3.6.12
    networks:
      - telemetry
    expose:
      - "3100"
    ports:
      - "127.0.0.1:0:3100"
    labels:
      ru.3ops.discovery.enabled: "true"
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "platform"
      ru.3ops.discovery.metrics.enabled: "true"
      ru.3ops.discovery.metrics.type: "prometheus"
      ru.3ops.discovery.metrics.port: "3100"
      ru.3ops.discovery.metrics.job: "loki"

  grafana:
    # Demo only: gated behind the compose profile "demo", so the e2e
    # fixture (which never passes --profile demo) never starts it. Anonymous
    # admin, no login form; datasources pre-wired to prometheus/loki over
    # the telemetry network. Self-monitoring dashboards work out of the box
    # because alloy/prometheus/loki already carry the contract metrics.*
    # labels (dogfooding).
    image: grafana/grafana:13.1.1
    profiles: ["demo"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - ./grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    networks:
      - telemetry
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${RU_3OPS_DISCOVERY_E2E_PG_USER:?set by the pytest fixture}
      POSTGRES_PASSWORD: ${RU_3OPS_DISCOVERY_E2E_PG_PASSWORD:?set by the pytest fixture}
    networks:
      - telemetry
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      # database.port is DELIBERATELY absent: the "no port label means
      # the type's standard port" path is under test.
      ru.3ops.discovery.enabled: "true"
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "data"
      ru.3ops.discovery.database.enabled: "true"
      ru.3ops.discovery.database.type: "postgres"
      ru.3ops.discovery.database.secret-id: "postgres-orders"

  db-badsecret:
    # Negative scenario: everything valid except the secret-id, which
    # fails the manifest section 9 regex. The relabel chain must drop
    # the target; no exporter appears.
    image: postgres:18
    environment:
      POSTGRES_USER: ${RU_3OPS_DISCOVERY_E2E_PG_USER:?set by the pytest fixture}
      POSTGRES_PASSWORD: ${RU_3OPS_DISCOVERY_E2E_PG_PASSWORD:?set by the pytest fixture}
    networks:
      - telemetry
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      ru.3ops.discovery.enabled: "true"
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "data"
      ru.3ops.discovery.database.enabled: "true"
      ru.3ops.discovery.database.type: "postgres"
      ru.3ops.discovery.database.secret-id: "bad/../id"

  mariadb:
    image: mariadb:12.3.2
    environment:
      MARIADB_ROOT_PASSWORD: ${RU_3OPS_DISCOVERY_E2E_MARIADB_PASSWORD:?set by the pytest fixture}
    networks:
      - telemetry
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-p$$MARIADB_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      ru.3ops.discovery.enabled: "true"
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "data"
      ru.3ops.discovery.database.enabled: "true"
      ru.3ops.discovery.database.type: "mariadb"
      ru.3ops.discovery.database.secret-id: "mariadb-billing"

  redis:
    image: redis:8.8.0
    command: ["redis-server", "--requirepass", "${RU_3OPS_DISCOVERY_E2E_REDIS_PASSWORD:?set by the pytest fixture}"]
    networks:
      - telemetry
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$RU_3OPS_DISCOVERY_E2E_REDIS_PASSWORD", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      RU_3OPS_DISCOVERY_E2E_REDIS_PASSWORD: ${RU_3OPS_DISCOVERY_E2E_REDIS_PASSWORD:?set by the pytest fixture}
    labels:
      ru.3ops.discovery.enabled: "true"
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "data"
      ru.3ops.discovery.database.enabled: "true"
      ru.3ops.discovery.database.type: "redis"
      ru.3ops.discovery.database.secret-id: "redis-cache"

  mongodb:
    image: mongo:8.3.7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${RU_3OPS_DISCOVERY_E2E_MONGO_USER:?set by the pytest fixture}
      MONGO_INITDB_ROOT_PASSWORD: ${RU_3OPS_DISCOVERY_E2E_MONGO_PASSWORD:?set by the pytest fixture}
    networks:
      - telemetry
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      ru.3ops.discovery.enabled: "true"
      ru.3ops.discovery.version: "0.2"
      # environment/team INTENTIONALLY omitted: exercises the coalesce
      # absent-optional-label path in the enrichment (see 030_database).
      ru.3ops.discovery.database.enabled: "true"
      ru.3ops.discovery.database.type: "mongodb"
      ru.3ops.discovery.database.secret-id: "mongodb-docs"

  rabbitmq:
    # Native prometheus endpoint (manifest example 10.1.2), but with
    # profile normal-v1: the example's fast-v1 is deliberately NOT
    # implemented by the reference (manifest 14), so a copied fast-v1
    # would never be scraped.
    image: rabbitmq:4.3.2-management
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - telemetry
    expose:
      - "15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      ru.3ops.discovery.enabled: "true"
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "platform"
      ru.3ops.discovery.metrics.enabled: "true"
      ru.3ops.discovery.metrics.type: "prometheus"
      ru.3ops.discovery.metrics.port: "15692"
      ru.3ops.discovery.metrics.path: "/metrics"
      ru.3ops.discovery.metrics.job: "rabbitmq"
      ru.3ops.discovery.metrics.profile: "normal-v1"

  app-metrics:
    build: ./app
    environment:
      APP_METRICS_PORT: "8000"
    networks:
      - telemetry
    expose:
      - "8000"
    labels:
      ru.3ops.discovery.enabled: "true"
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "apps"
      ru.3ops.discovery.metrics.enabled: "true"
      ru.3ops.discovery.metrics.type: "prometheus"
      ru.3ops.discovery.metrics.port: "8000"
      ru.3ops.discovery.metrics.job: "app-metrics"
      ru.3ops.discovery.logs.service: "app-metrics"

  app-logs-json:
    build: ./app
    environment:
      APP_LOG_FORMAT: json
    networks:
      - telemetry
    labels:
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "apps"
      ru.3ops.discovery.logs.profile: "generic-json-v1"
      ru.3ops.discovery.logs.service: "app-logs-json"

  app-logs-logfmt:
    build: ./app
    environment:
      APP_LOG_FORMAT: logfmt
    networks:
      - telemetry
    labels:
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "apps"
      ru.3ops.discovery.logs.profile: "generic-logfmt-v1"
      ru.3ops.discovery.logs.service: "app-logs-logfmt"

  app-logs-mixed:
    build: ./app
    environment:
      APP_LOG_FORMAT: mixed
    networks:
      - telemetry
    labels:
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "apps"
      ru.3ops.discovery.logs.profile: "mixed-v1"
      ru.3ops.discovery.logs.service: "app-logs-mixed"

  app-logs-pytrace:
    build: ./app
    environment:
      APP_LOG_FORMAT: python-traceback
    networks:
      - telemetry
    labels:
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "apps"
      ru.3ops.discovery.logs.profile: "python-stacktrace-v1"
      ru.3ops.discovery.logs.service: "app-logs-pytrace"

  app-logs-jtrace:
    build: ./app
    environment:
      APP_LOG_FORMAT: java-traceback
    networks:
      - telemetry
    labels:
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "apps"
      ru.3ops.discovery.logs.profile: "java-stacktrace-v1"
      ru.3ops.discovery.logs.service: "app-logs-jtrace"

  app-logs-raw:
    # No manifest labels at all: the collect-by-default policy
    # (manifest 10.3.1) must pick it up with log_profile="raw-v1".
    build: ./app
    environment:
      APP_LOG_FORMAT: raw
    networks:
      - telemetry

  app-logs-unknown:
    # Unknown profile degrades to raw-v1 without losing logs
    # (manifest 10.3.4).
    build: ./app
    environment:
      APP_LOG_FORMAT: json
    networks:
      - telemetry
    labels:
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.logs.profile: "no-such-profile-v9"
      ru.3ops.discovery.logs.service: "app-logs-unknown"

  app-fuzz:
    # Pipeline resilience to garbage: fuzz stdout under generic-json-v1
    # (broken input must degrade to raw, not break the stage) plus
    # fuzzed metrics.
    build: ./app
    environment:
      APP_LOG_FORMAT: fuzz
      APP_METRICS_PORT: "8000"
      APP_FUZZ_TELEMETRY: "1"
    networks:
      - telemetry
    expose:
      - "8000"
    labels:
      ru.3ops.discovery.enabled: "true"
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "apps"
      ru.3ops.discovery.metrics.enabled: "true"
      ru.3ops.discovery.metrics.type: "prometheus"
      ru.3ops.discovery.metrics.port: "8000"
      ru.3ops.discovery.metrics.job: "app-fuzz"
      ru.3ops.discovery.logs.profile: "generic-json-v1"
      ru.3ops.discovery.logs.service: "app-fuzz"

  app-burst:
    # Burst smoke, not a benchmark: ~1000 numbered json lines/s for
    # ~10s; the assertion is zero loss.
    build: ./app
    environment:
      APP_LOG_FORMAT: json
      APP_BURST: "1000:10"
    networks:
      - telemetry
    labels:
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.logs.profile: "generic-json-v1"
      ru.3ops.discovery.logs.service: "app-burst"

  app-silent:
    # Explicit opt-out (manifest 10.3.7): stdout keeps flowing, Loki
    # must receive nothing; the test proves the container DID write via
    # docker logs first (positive control).
    build: ./app
    environment:
      APP_LOG_FORMAT: json
    networks:
      - telemetry
    labels:
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.logs.enabled: "false"

  app-otel:
    # logs.enabled=false turns the docker log path off, so logs reach Loki
    # ONLY through OTLP (proof of the path). The otel domain is declarative
    # (manifest 10.5); the receiver is shared.
    build: ./app
    environment:
      APP_OTLP_ENDPOINT: http://alloy:4318
    networks:
      - telemetry
    depends_on:
      alloy:
        condition: service_started
    labels:
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "apps"
      ru.3ops.discovery.otel.enabled: "true"
      ru.3ops.discovery.otel.protocol: "http"
      ru.3ops.discovery.otel.service: "app-otel"
      ru.3ops.discovery.otel.metrics: "true"
      ru.3ops.discovery.otel.logs: "true"
      ru.3ops.discovery.logs.enabled: "false"

  blackbox-probe:
    # Blackbox domain (manifest 10.4): this container is not scraped for its
    # own metrics -- Alloy PROBES it over HTTP via prometheus.exporter.blackbox
    # (module http_2xx) and emits probe_success. The app image already serves
    # HTTP; the probe hits its metrics port.
    build: ./app
    environment:
      APP_METRICS_PORT: "8080"
    networks:
      - telemetry
    expose:
      - "8080"
    labels:
      ru.3ops.discovery.enabled: "true"
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "platform"
      ru.3ops.discovery.blackbox.enabled: "true"
      ru.3ops.discovery.blackbox.module: "http_2xx"
      ru.3ops.discovery.blackbox.port: "8080"
      ru.3ops.discovery.blackbox.path: "/metrics"

  blackbox-badscheme:
    # Negative scenario (manifest 11, fail-closed): everything valid except
    # scheme "ftp", which is neither http nor https. The discovery.relabel
    # "blackbox" scheme keep-rule (regex "(https?)?") must DROP this target
    # -- no probe URL is composed, no probe_success emitted. Proves the
    # scheme allowlist is fail-closed, mirroring db-badsecret in 030.
    build: ./app
    environment:
      APP_METRICS_PORT: "8080"
    networks:
      - telemetry
    expose:
      - "8080"
    labels:
      ru.3ops.discovery.enabled: "true"
      ru.3ops.discovery.version: "0.2"
      ru.3ops.discovery.environment: "e2e"
      ru.3ops.discovery.team: "platform"
      ru.3ops.discovery.blackbox.enabled: "true"
      ru.3ops.discovery.blackbox.module: "http_2xx"
      ru.3ops.discovery.blackbox.port: "8080"
      ru.3ops.discovery.blackbox.path: "/metrics"
      ru.3ops.discovery.blackbox.scheme: "ftp"

  snmp-agent:
    # File-provider domain target (manifest 10.6): external SNMP hardware has
    # no container, so 037_snmp.alloy finds it via a device file, NOT Docker
    # discovery. Hence NO ru.3ops.discovery.* labels here. Net-SNMP snmpd
    # serves IF-MIB over SNMPv3 authPriv (user netmon, SHA/AES); the creds
    # match the snmp_auths.yaml fixture. Unprofiled so it runs in e2e + demo.
    build: ./snmp-agent
    networks:
      - telemetry
    expose:
      - "161/udp"
